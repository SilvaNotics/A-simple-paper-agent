[mypy]
# 类型检查配置：`python -m mypy --ignore-missing-imports src main.py`
# （第三方库大多没有完整类型信息，缺失导入一律忽略；我们的代码本身要求零 error）
python_version = 3.14
explicit_package_bases = True
mypy_path = .
ignore_missing_imports = True
warn_unused_ignores = False
warn_redundant_casts = True
show_error_codes = True
exclude = (^data/|^output/|^tests/fixtures/)
